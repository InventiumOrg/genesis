apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventiumdev01-ingress
  namespace: inventiumdev01-management
  labels:
    name: inventiumdev01-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: cicd.inventiums.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: jenkins-service
            port: 
              number: 80
